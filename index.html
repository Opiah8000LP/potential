<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dweebpedia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header">
  <a id="logo" href="#/" title="Main page"><span id="logo-mark">D</span></a>
  <div id="site-title"><a href="#/" id="site-name">Dweebpedia</a><br><span id="site-tagline"></span></div>
  <form id="search-form" action="#">
    <input type="text" id="search-input" placeholder="Search" aria-label="Search">
    <input type="submit" value="Search">
  </form>
</div>

<div id="layout">
  <div id="sidebar">
    <div class="portlet">
      <h3>Navigation</h3>
      <ul>
        <li><a href="#/">Main page</a></li>
        <li><a href="#/topics">All topics</a></li>
        <li><a href="#/all">All articles</a></li>
        <li><a href="#/random">Random article</a></li>
        <li><a href="" id="main-site-link" target="_blank" rel="noopener"></a></li>
      </ul>
    </div>
  </div>

  <div id="content"></div>
</div>

<div id="footer">
  <p id="footer-text"></p>
</div>

<script src="config.js"></script>
<script src="loader.js"></script>
<script src="site.js"></script>
</body>
</html>
